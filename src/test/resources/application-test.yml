# The agent only talks to Tower over wss://, so tests run the embedded server over TLS
# too. test-keystore.p12 holds a self-signed certificate for localhost (password
# changeit), used as the server key store and as the client trust store.
micronaut:
  server:
    ssl:
      enabled: true
      port: -1
      key-store:
        path: classpath:test-keystore.p12
        type: PKCS12
        password: changeit
  http:
    client:
      ssl:
        trust-store:
          path: classpath:test-keystore.p12
          type: PKCS12
          password: changeit

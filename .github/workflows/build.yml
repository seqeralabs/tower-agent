name: Tower Agent continuous build
permissions:
  contents: read
on:
  push:
    branches:
      - '*'
      - '!refs/tags/.*'
    tags-ignore:
      - '*'
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  linux-image:
    name: Linux
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Environment
        run: env | sort

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup Graalvm
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25.0.2'
          distribution: 'graalvm-community'
          native-image-musl: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests
        run: ./gradlew cleanTest test

      - name: Tests reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-test-reports
          path: build/reports/tests/test/

      # Re-runs the tests inside a native image. Some GraalVM features are disabled
      # by default and only fail at run time, which a JVM test run cannot detect.
      - name: Native tests
        run: ./gradlew nativeTest
        env:
          PLATFORM: linux-x86_64

      - name: Build Native Image
        run: ./gradlew nativeCompile
        env:
          PLATFORM: linux-x86_64

      - name: Verify native image is statically linked
        run: |
          file build/native/nativeCompile/tw-agent
          file build/native/nativeCompile/tw-agent | grep -q 'statically linked' || {
            echo "::error::tw-agent is not statically linked -- --static --libc=musl did not reach native-image"
            exit 1
          }

      - name: Build fat JAR
        run: ./gradlew shadowJar

      - name: Upload linux native image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tw-agent-linux
          path: build/native/nativeCompile/tw-agent

      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tw-agent-jar
          path: build/libs/tw-agent.jar

  release:
    name: Release
    if: "contains(github.event.head_commit.message, '[release]') && github.event.ref=='refs/heads/master'"
    needs: [ linux-image ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Setup Java for JReleaser
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Version
        id: version
        run: |
          VERSION=$(cat ./VERSION)
          echo "VERSION = $VERSION"
          echo "::set-output name=VERSION::$VERSION"

      - name: Run JReleaser
        uses: jreleaser/release-action@082d8e644166794bcd85f00410af969b1655ca3f # 1.4.0
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.VERSION }}
